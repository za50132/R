<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>請進 操作頁</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#2a2e33" />
  <link rel="icon" href="img/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="img/icon-180.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="請進叫號" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/app.css" />
  <script src="config.js"></script>
  <script>
    if (QC_CONFIG.supabaseUrl) document.write('<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"><\/script>');
  </script>
</head>
<body>
  <div class="demo-banner" id="demoBanner" hidden>示範模式・店內密碼 111111・店長密碼 999999</div>

  <!-- ===== 登入 ===== -->
  <section class="login" id="loginView" hidden>
    <header class="sign">
      <div class="sign-left">
        <img class="sign-mark" src="img/mark.svg" alt="" />
        <div><div class="sign-name">請進</div><div class="sign-en">PLEASE COME IN</div></div>
      </div>
      <div class="sign-right"><span class="sign-word">叫號操作</span></div>
    </header>

    <div id="pinStep">
      <h1>輸入店內密碼</h1>
      <p>第一次使用才需要輸入，之後這支手機會記住。</p>
      <form id="pinForm">
        <input class="field" id="pinInput" type="password" inputmode="numeric" autocomplete="current-password" placeholder="••••••" aria-label="店內密碼" />
        <div class="err" id="pinErr"></div>
        <button class="btn primary wide" type="submit">進入</button>
      </form>
    </div>

  </section>

  <!-- ===== 叫號 ===== -->
  <section id="mainView" hidden>
    <div class="topbar">
      <div class="topbar-title">請進<small>叫號操作</small></div>
      <div class="topbar-shop">叫號 <b class="num" id="shopNum">---</b><span class="topbar-q">等 <b class="num" id="shopWaiting">0</b> 人</span></div>
    </div>

    <main class="wrap">
      <div class="dgrid" id="dgrid" aria-label="設計師：按一下叫下一號"></div>

      <h2 class="section-title">各設計師等候</h2>
      <div class="card wstats" id="wstats"></div>

      <h2 class="section-title qtitle">等候名單 <small id="queueCount"></small><button class="multi-btn" id="btnMulti" type="button">多選</button></h2>
      <div class="panel queue-panel">
        <div class="queue" id="queue"></div>
        <div class="skipped" id="skippedWrap" hidden>
          <p class="skipped-title">過號（回來要再等 <span id="skipAfter">3</span> 位）</p>
          <div class="queue" id="skipped"></div>
        </div>
        <div class="batchbar" id="batchBar" hidden>
          <span id="batchCount">點號碼勾選</span>
          <button class="btn" type="button" id="batchAssign" disabled>指派</button>
          <button class="btn danger" type="button" id="batchCancel" disabled>取消這些號</button>
        </div>
        <button class="btn wide undo-issue" id="btnUndoIssue">取消最後加的一號</button>
      </div>

      <h2 class="section-title">號碼調整</h2>
      <div class="card numfix">
        <button class="row btn-row" data-fix="set_number">
          <div class="row-main"><div class="row-value">目前叫到</div></div><b class="num numfix-val" id="fixCalled">---</b><span class="row-go">›</span>
        </button>
        <button class="row btn-row" data-fix="set_issued">
          <div class="row-main"><div class="row-value">抽號機發到</div></div><b class="num numfix-val" id="fixIssued">---</b><span class="row-go">›</span>
        </button>
        <button class="row btn-row" data-fix="recall_ticket">
          <div class="row-main"><div class="row-value">叫回號碼</div><div class="row-label">取消或剪完的號碼，放回等候名單</div></div><span class="row-go">›</span>
        </button>
        <button class="row btn-row" id="btnReset">
          <div class="row-main"><div class="row-value" style="color:var(--danger)">今日歸零</div><div class="row-label">要店長密碼</div></div><span class="row-go">›</span>
        </button>
      </div>

      <h2 class="section-title">其他</h2>
      <div class="card">
        <a class="row" href="index.html" target="_blank" rel="noopener">
          <div class="row-main"><div class="row-value">查看客人看到的畫面</div></div><span class="row-go">›</span>
        </a>
        <button class="row btn-row" id="btnOwner" style="width:100%;border:0;background:none;text-align:left">
          <div class="row-main"><div class="row-value">店長設定（排休、等候時間、上班時間、密碼）</div></div><span class="row-go">›</span>
        </button>
        <button class="row btn-row" id="btnLogout" style="width:100%;border:0;background:none;text-align:left">
          <div class="row-main"><div class="row-value" style="color:var(--danger)">登出這支手機</div></div>
        </button>
      </div>
      <footer class="credit">系統提供・藍騎士</footer>
    </main>
  </section>

  <!-- ===== 加號列：固定在畫面底部，隨時按得到 ===== -->
  <div class="issuebar" id="issueBar" hidden>
    <button class="issue-btn" id="btnIssue">不指定</button>
    <button class="issue-btn pick" id="btnIssuePick">指定</button>
  </div>

  <!-- 指定設計師加號 -->
  <dialog id="pickDialog" class="sheet">
    <h2 id="pickTitle">加號：指定哪位設計師？</h2>
    <div class="pick-grid" id="pickGrid"></div>
    <button class="btn wide" type="button" id="pickCancel" style="margin-top:12px">取消</button>
  </dialog>

  <!-- 多選：一次指派 -->
  <dialog id="batchDialog" class="sheet">
    <h2 id="batchTitle"></h2>
    <div class="pick-grid" id="batchGrid"></div>
    <button class="btn wide" type="button" id="batchClose" style="margin-top:12px">關閉</button>
  </dialog>

  <!-- 長按設計師：更多操作 -->
  <dialog id="dsheet" class="sheet">
    <h2 id="dsTitle"></h2>
    <div class="pick-grid">
      <button class="btn" type="button" id="dsSkip">過號</button>
      <button class="btn" type="button" id="dsCall">叫指定號碼</button>
      <button class="btn" type="button" id="dsShift">上班</button>
      <button class="btn" type="button" id="dsBreak">休息</button>
      <button class="btn" type="button" id="dsUndo">↶ 退回</button>
    </div>
    <button class="btn wide" type="button" id="dsClose" style="margin-top:12px">關閉</button>
  </dialog>

  <!-- 點等候名單的號碼 -->
  <dialog id="ticketDialog" class="sheet">
    <h2 id="ticketTitle"></h2>
    <button class="btn wide primary rejoin" type="button" id="ticketRejoin" hidden>客人回來了・排在 3 位後面</button>
    <div id="assignWrap">
      <p class="hint" id="assignHint">指派給：</p>
      <div class="pick-grid" id="assignGrid"></div>
    </div>
    <button class="btn wide danger" type="button" id="ticketCancel" style="margin-top:12px">取消這號</button>
    <button class="btn wide" type="button" id="ticketClose" style="margin-top:10px">關閉</button>
  </dialog>

  <!-- ===== 店長設定 ===== -->
  <section id="ownerView" hidden>
    <div class="topbar">
      <div class="topbar-title">店長設定</div>
      <button class="btn" id="btnOwnerBack" style="padding:6px 14px">完成</button>
    </div>
    <main class="wrap">
      <div class="panel">
        <h3>設計師排休</h3>
        <div class="chips" id="offChips"></div>
        <div class="cal-head">
          <button class="btn" id="calPrev" aria-label="上個月">‹</button>
          <span id="calTitle"></span>
          <button class="btn" id="calNext" aria-label="下個月">›</button>
        </div>
        <div class="cal" id="cal"></div>
      </div>

      <div class="panel">
        <h3>每位客人大約剪多久</h3>
        <div class="avg-row">
          <select class="field" id="avgCut" aria-label="每位客人幾分鐘"></select><span>分鐘</span>
        </div>
      </div>

      <div class="panel">
        <h3>上班時間</h3>
        <div class="shift-list" id="shifts"></div>
      </div>

      <div class="panel">
        <h3>修改密碼</h3>
        <form class="inline" id="staffPinForm" style="margin-bottom:10px">
          <input class="field" id="newStaffPin" type="password" inputmode="numeric" placeholder="新的店內密碼" />
          <button class="btn primary" type="submit">更新</button>
        </form>
        <form class="inline" id="ownerPinForm">
          <input class="field" id="newOwnerPin" type="password" inputmode="numeric" placeholder="新的店長密碼" />
          <button class="btn primary" type="submit">更新</button>
        </form>
      </div>
      <footer class="credit">系統提供・藍騎士</footer>
    </main>
  </section>

  <!-- 叫指定號碼 -->
  <dialog id="callDialog">
    <form method="dialog" id="callForm">
      <h2 id="callTitle">叫指定號碼</h2>
      <input class="field" id="callInput" type="number" inputmode="numeric" min="1" max="999" placeholder="號碼" />
      <div class="dialog-actions">
        <button class="btn" value="cancel" type="button" id="callCancel">取消</button>
        <button class="btn primary" value="ok">叫號</button>
      </div>
    </form>
  </dialog>

  <!-- 號碼調整：輸入一個號碼 -->
  <dialog id="numDialog">
    <form method="dialog" id="numForm">
      <h2 id="numTitle"></h2>
      <p class="hint" id="numHint"></p>
      <input class="field numfix-input" id="numInput" type="number" inputmode="numeric" min="0" max="999" />
      <div class="dialog-actions">
        <button class="btn" type="button" id="numCancel">取消</button>
        <button class="btn primary" value="ok">確定</button>
      </div>
    </form>
  </dialog>

  <!-- 店長密碼 -->
  <dialog id="ownerDialog">
    <form method="dialog" id="ownerForm">
      <h2>輸入店長密碼</h2>
      <input class="field" id="ownerPinInput" type="password" inputmode="numeric" placeholder="••••••" />
      <div class="err" id="ownerErr"></div>
      <div class="dialog-actions">
        <button class="btn" type="button" id="ownerCancel">取消</button>
        <button class="btn primary" value="ok">進入</button>
      </div>
    </form>
  </dialog>

  <!-- 確認（取代瀏覽器的 confirm，手機上比較好按） -->
  <dialog id="askDialog">
    <form method="dialog">
      <h2 id="askText"></h2>
      <div class="dialog-actions">
        <button class="btn" value="no">取消</button>
        <button class="btn primary" value="yes" id="askYes">確定</button>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="js/common.js"></script>
  <script src="js/store.js"></script>
  <script src="js/staff.js"></script>
</body>
</html>
