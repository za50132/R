<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>請進 快剪｜線上看號</title>
  <meta name="description" content="請進 $120 佰二剪髮 — 線上即時看叫號、設計師上班與休假。新北市永和區永平路180巷1號1F" />
  <meta name="theme-color" content="#5fb4aa" />
  <meta property="og:title" content="請進 快剪｜線上看號" />
  <meta property="og:description" content="即時看目前叫到幾號，不用在店門口等。" />
  <link rel="icon" href="img/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="img/icon-180.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="apple-mobile-web-app-title" content="請進看號" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/app.css" />
  <script src="config.js"></script>
  <script>
    if (QC_CONFIG.supabaseUrl) document.write('<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"><\/script>');
  </script>
</head>
<body>
  <div class="demo-banner" id="demoBanner" hidden>示範模式：資料只存在這台電腦。用同一個瀏覽器另開「操作頁」就能試叫號。</div>

  <main class="wrap">
    <header class="sign" aria-label="請進 PLEASE COME IN ｜ $120 佰二剪髮">
      <div class="sign-left">
        <svg class="sign-logo" viewBox="150 36 670 360" role="img" aria-label="請進 HAIR CUT PLEASE COME IN">
          <!-- 鏡框：黑色外框，裡面一塊湖水綠 -->
          <polygon points="208,60 322,60 322,250 236,224" fill="#5fb4aa"/>
          <polyline points="322,96 322,52 164,52 190,264 312,264" fill="none" stroke="#1d1f22" stroke-width="7"/>
        
          <g fill="#1d1f22">
            <!-- 「請」的言字旁：綁小馬尾的人，身體是倒梯形 -->
            <circle cx="316" cy="130" r="43"/>
            <path d="M284 108 C 266 98, 250 104, 239 118 C 256 115, 270 122, 288 134 Z"/>
            <rect x="329" y="166" width="12" height="20"/>
            <polygon points="294,182 358,182 358,273 322,273"/>
            <polygon points="322,270 356,270 386,315 306,315"/>
        
            <!-- 「請」的青 -->
            <rect x="420" y="103" width="13" height="84"/>
            <rect x="365" y="116" width="133" height="13"/>
            <rect x="372" y="147" width="119" height="13"/>
            <rect x="359" y="175" width="154" height="13"/>
            <rect x="397" y="200" width="13" height="112"/>
            <rect x="397" y="200" width="109" height="12"/>
            <rect x="493" y="200" width="13" height="105"/>
            <rect x="478" y="294" width="28" height="11"/>
            <rect x="404" y="228" width="94" height="11"/>
            <rect x="404" y="258" width="94" height="11"/>
        
            <!-- 「進」的辵字旁：兩邊翹髮尾的短髮人，身體加寬，下面往右延伸的斜底 -->
            <path d="M594 100 C 626 100, 642 124, 640 152 C 639 168, 636 178, 644 192 C 630 190, 620 185, 610 185 L 578 185 C 566 185, 560 181, 545 186 C 554 173, 551 158, 551 146 C 551 118, 566 100, 594 100 Z"/>
            <polygon points="597,187 627,187 660,289 597,289"/>
            <polygon points="597,302 802,299 597,323"/>
        
            <!-- 「進」的隹：上面一點、左上一撇、四橫 -->
            <polygon points="690,139 728,157 722,168 687,150"/>
            <polygon points="655,136 667,136 667,182 655,182"/>
            <polygon points="655,176 668,182 648,215 635,207"/>
            <rect x="669" y="171" width="12" height="124"/>
            <rect x="716" y="171" width="12" height="118"/>
            <rect x="669" y="171" width="104" height="13"/>
            <rect x="681" y="206" width="92" height="13"/>
            <rect x="681" y="240" width="95" height="13"/>
            <rect x="681" y="276" width="115" height="14"/>
          </g>
        
          <!-- HAIR CUT ✂ PLEASE COME IN -->
          <g transform="skewX(-14)" font-family="Noto Sans TC, sans-serif" font-weight="500" fill="#1d1f22" font-size="31">
            <text x="300" y="382" textLength="180" lengthAdjust="spacingAndGlyphs">HAIR CUT</text>
            <text x="573" y="382" textLength="312" lengthAdjust="spacing">PLEASE COME IN</text>
          </g>
          <!-- 剪刀 -->
          <g transform="translate(436 370) rotate(-20)" fill="none" stroke-width="3.2">
            <circle cx="-7" cy="-9" r="5.5" stroke="#1d1f22"/>
            <circle cx="-7" cy="9" r="5.5" stroke="#1d1f22"/>
            <path d="M-2 -6 L 16 6 M-2 6 L 16 -6" stroke="#5fb4aa" stroke-linecap="round"/>
          </g>
        </svg>
      </div>
      <div class="sign-right">
        <span class="sign-price num">$120</span>
        <span class="sign-word">佰二剪髮</span>
      </div>
    </header>

    <div class="statusbar">
      <span class="pill"><span class="dot" id="openDot"></span><span id="openLabel">營業中</span></span>
      <span class="live" id="live"><span class="dot"></span><span id="liveLabel">連線中…</span></span>
    </div>

    <div class="quiet" id="quiet" role="status" hidden>
      <span class="quiet-dot"></span>
      <div><b>現在人少，到店幾乎不用等</b><small id="quietSub"></small></div>
    </div>

    <section class="hero" aria-live="polite">
      <div class="hero-label">目前叫號</div>
      <div class="hero-num num" id="heroNum">---</div>
      <div class="hero-sub" id="heroSub">請對照您的號碼牌</div>
      <div class="wait" id="wait" hidden>
        <span class="wait-label">預估等候</span>
        <span class="wait-value" id="waitValue"></span>
      </div>
    </section>

    <section class="card myticket" id="myCard" hidden>
      <form class="inline" id="myForm">
        <input class="field" id="myNum" type="number" inputmode="numeric" min="1" max="999" placeholder="輸入您的號碼" aria-label="您的號碼" />
        <button class="btn primary" type="submit">查詢</button>
      </form>
      <div class="my-result" id="myResult" aria-live="polite"></div>
    </section>

    <h2 class="section-title">設計師</h2>
    <section class="grid" id="designers"></section>

    <h2 class="section-title">近期休假</h2>
    <section class="card">
      <ul class="offlist" id="offList"></ul>
    </section>

    <h2 class="section-title">店家資訊</h2>
    <section class="card">
      <div class="row">
        <svg class="row-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
        <div class="row-main"><div class="row-label">營業時間</div><div class="row-value" id="hours"></div></div>
      </div>
      <a class="row" id="mapLink" target="_blank" rel="noopener">
        <svg class="row-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s7-6.3 7-12a7 7 0 10-14 0c0 5.7 7 12 7 12z"/><circle cx="12" cy="9" r="2.5"/></svg>
        <div class="row-main"><div class="row-label">地址（開啟地圖）</div><div class="row-value" id="address"></div></div>
        <span class="row-go">›</span>
      </a>
      <a class="row" id="telLink">
        <svg class="row-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 005 5L15 13l5 2v4a2 2 0 01-2 2A16 16 0 013 6a2 2 0 012-2z"/></svg>
        <div class="row-main"><div class="row-label">電話（點一下撥打）</div><div class="row-value num" id="phone"></div></div>
        <span class="row-go">›</span>
      </a>
    </section>
    <footer class="credit"><span class="credit-badge"><svg class="credit-mark" viewBox="0 0 16 18" aria-hidden="true"><path d="M8 1 14.5 3.5V8.5C14.5 12.6 11.8 15.6 8 17 4.2 15.6 1.5 12.6 1.5 8.5V3.5Z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M4.8 6.5 8 9.6 11.2 6.5M4.8 10 8 13.1 11.2 10" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="credit-by">POWERED BY</span><span class="credit-sep"></span><b class="credit-name">BLUE KNIGHT</b></span></footer>
  </main>

  <script src="js/common.js"></script>
  <script src="js/store.js"></script>
  <script src="js/customer.js"></script>
</body>
</html>
