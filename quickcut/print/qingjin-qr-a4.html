  @page { size: A4; margin: 0; }
  :root {
    --teal: #5fb4aa; --teal-dark: #3f8f86; --teal-soft: #e3f3f1;
    --ink: #2a2e33; --ink-soft: #5d646c; --wood: #b07a4f; --bg: #f3f5f5;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #fff; }
  body {
    font-family: 'QC', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
    color: var(--ink); -webkit-print-color-adjust: exact; print-color-adjust: exact;
  }
  .page {
    width: 210mm; height: 297mm; padding: 13mm 14mm 10mm;
    display: flex; flex-direction: column; align-items: center; overflow: hidden;
  }
  .page > * { flex-shrink: 0; }

  /* 招牌：白底黑字＋湖水綠圓弧，下緣木頭色 */
  .sign {
    width: 100%; display: flex; align-items: stretch; border-radius: 6mm; overflow: hidden;
    border: 0.6mm solid #dfe5e4; border-bottom: 3mm solid var(--wood); background: #fff;
  }
  .sign-left { display: flex; align-items: center; gap: 4mm; padding: 5mm 6mm 4mm 8mm; }
  .sign-left svg { width: 17mm; height: 17mm; }
  .sign-name { font-size: 15mm; font-weight: 900; line-height: 1; letter-spacing: .08em; }
  .sign-en { font-size: 3.4mm; font-weight: 500; letter-spacing: .2em; color: var(--ink-soft); margin-top: 2.5mm; white-space: nowrap; }
  .sign-right {
    flex: 1; display: flex; align-items: center; justify-content: center; gap: 4mm;
    background: var(--teal); color: #1f2a2c; font-weight: 900;
    border-top-left-radius: 16mm 100%; border-bottom-left-radius: 16mm 100%; padding: 0 6mm 0 12mm;
  }
  .sign-price { font-size: 12mm; letter-spacing: .02em; }
  .sign-word { font-size: 10mm; letter-spacing: .1em; white-space: nowrap; }

  h1 {
    margin-top: 9mm; font-size: 24mm; font-weight: 900; line-height: 1; letter-spacing: .06em;
    display: flex; align-items: center; gap: 5mm;
  }
  h1 .arrow { color: var(--teal); font-size: 20mm; transform: translateY(1mm); }
  .lede { margin-top: 6mm; font-size: 6.6mm; font-weight: 500; color: var(--ink-soft); letter-spacing: .04em; text-align: center; line-height: 1.5; }
  .lede b { color: var(--ink); font-weight: 900; }

  /* QR Code：四角用招牌標誌的框線 */
  .qr-wrap { position: relative; margin-top: 6mm; padding: 8mm; }
  .qr-wrap::before, .qr-wrap::after {
    content: ''; position: absolute; width: 22mm; height: 22mm; border: 2.6mm solid var(--teal);
  }
  .qr-wrap::before { left: 0; top: 0; border-right: 0; border-bottom: 0; border-top-left-radius: 3mm; }
  .qr-wrap::after { right: 0; bottom: 0; border-left: 0; border-top: 0; border-bottom-right-radius: 3mm; }
  .qr { width: 80mm; height: 80mm; display: block; }

  .steps { margin-top: 6mm; width: 100%; display: grid; grid-template-columns: repeat(3, 1fr); gap: 5mm; }
  .step { background: var(--teal-soft); border-radius: 5mm; padding: 4mm 4mm; text-align: center; }
  .step .n {
    width: 10mm; height: 10mm; border-radius: 50%; background: var(--teal); color: #fff;
    font-size: 6mm; font-weight: 900; display: grid; place-items: center; margin: 0 auto 3mm;
  }
  .step .t { font-size: 6mm; font-weight: 900; line-height: 1.3; }
  .step .s { font-size: 4mm; font-weight: 500; color: var(--ink-soft); margin-top: 1.5mm; line-height: 1.4; }

  .note { margin-top: 5mm; font-size: 4.4mm; font-weight: 500; color: var(--ink-soft); text-align: center; }
  .note b { color: #a85a10; font-weight: 900; }

  footer {
    margin-top: auto; width: 100%; padding-top: 4mm; border-top: 0.5mm solid #e3e7ea;
    display: flex; justify-content: space-between; align-items: flex-end; gap: 6mm;
    font-size: 4.2mm; font-weight: 500; color: var(--ink-soft); line-height: 1.6;
  }
  footer .url { font-size: 5mm; font-weight: 900; color: var(--teal-dark); letter-spacing: .02em; }
  footer .right { text-align: right; }
</style>
</head>
