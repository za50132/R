    <rect x="370" y="129" width="116" height="12"/>
    <rect x="346" y="152" width="172" height="13"/>
    <rect x="398" y="178" width="13" height="132"/>
    <rect x="398" y="178" width="110" height="12"/>
    <rect x="495" y="178" width="13" height="124"/>
