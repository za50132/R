# 每天台北時間凌晨 3:17 自動備份所有客戶的資料，結果 commit 回這個 repo。
# 需要先在 repo 的 Settings → Secrets and variables → Actions 新增 SUPABASE_DB_URL。
name: 每日客戶資料備份

on:
  schedule:
    - cron: "17 19 * * *"   # UTC 19:17 = 台北 03:17
  workflow_dispatch: {}      # 也可以在 Actions 頁面手動按「Run workflow」

permissions:
  contents: write

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: 匯出所有客戶資料
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: node backup.mjs data
      - name: 有變動就 commit
        run: |
          git config user.name "backup-bot"
          git config user.email "backup-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "資料沒有變動，不用 commit"
          else
            git commit -m "備份 $(TZ=Asia/Taipei date +%F)"
            git push
          fi
